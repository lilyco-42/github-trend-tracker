function tr(key, lang) {
  return key.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : key), L[lang]) || key;
}
function useI18n(){
  const [lang,setL]=useState(()=>localStorage.getItem('gt-lang')||'zh');
  useEffect(()=>localStorage.setItem('gt-lang',lang),[lang]);
  const t=useCallback((k)=>tr(k,lang),[lang]);
  return {t,lang,setLang:setL};
}

// ===================================================================
//  MODE SWITCHER (shared across all modes)
// ===================================================================
const MODES = [
  { id:'cli', label:'CLI',    icon:'>_',  color:'#00ff41', desc:'命令行终端' },
  { id:'tui', label:'TUI',    icon:'◇',  color:'#ff79c6', desc:'仪表盘终端' },
  { id:'el',  label:'ELECTRON',icon:'●', color:'#8be9fd', desc:'桌面应用风格' },
];

function ModeSwitcher({mode,onMode,onRefresh,lang,setLang}){
  return (
    <div style={{
      position:'fixed',top:0,left:0,right:0,zIndex:99999,
      display:'flex',justifyContent:'center',alignItems:'center',gap:0,gap:'0px',
      background:'rgba(0,0,0,.88)',backdropFilter:'blur(18px)',
      borderBottom:'1px solid rgba(255,255,255,.06)',
      padding:'5px 12px',fontFamily:'Inter,sans-serif',
    }}>
      {MODES.map((m,i)=>(
        <React.Fragment key={m.id}>
          {i>0&&<div style={{width:1,height:18,background:'rgba(255,255,255,.06)',margin:'0 6px'}}/>}
          <button onClick={()=>onMode(m.id)}
            style={{
              background:mode===m.id?`${m.color}12`:'transparent',
              border:`1px solid ${mode===m.id?m.color+'40':'transparent'}`,
              color:mode===m.id?m.color:'rgba(255,255,255,.35)',
              padding:'5px 16px',borderRadius:4,cursor:'pointer',
              fontSize:'10px',fontWeight:600,letterSpacing:'1px',
              textTransform:'uppercase',transition:'all .2s',
              display:'flex',alignItems:'center',gap:6,
              fontFamily:'inherit',
            }}
            onMouseEnter={e=>{if(mode!==m.id)e.target.style.color='rgba(255,255,255,.6)'}}
            onMouseLeave={e=>{if(mode!==m.id)e.target.style.color='rgba(255,255,255,.35)'}}
          >
            <span style={{fontSize:12}}>{m.icon}</span>
            {m.label}
          </button>
        </React.Fragment>
      ))}
      <div style={{flex:1}}/>
      <button onClick={onRefresh}
        style={{
          background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.08)',
          color:'rgba(255,255,255,.3)',padding:'4px 10px',borderRadius:4,cursor:'pointer',
          fontSize:'9px',transition:'all .2s',fontFamily:'inherit',marginRight:8,
        }}
        onMouseEnter={e=>{e.target.style.color='#fff';e.target.style.background='rgba(255,255,255,.08)'}}
        onMouseLeave={e=>{e.target.style.color='rgba(255,255,255,.3)';e.target.style.background='rgba(255,255,255,.04)'}}
      >⟳ {tr('sync',lang)}</button>
      <button onClick={()=>setLang(lang==='zh'?'en':'zh')}
        style={{
          background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.08)',
          color:'rgba(255,255,255,.4)',padding:'4px 8px',borderRadius:4,cursor:'pointer',
          fontSize:'10px',fontWeight:600,transition:'all .2s',fontFamily:'inherit',
          minWidth:32,textAlign:'center',
        }}
        onMouseEnter={e=>{e.target.style.color='#fff';e.target.style.borderColor='rgba(255,255,255,.2)'}}
        onMouseLeave={e=>{e.target.style.color='rgba(255,255,255,.4)';e.target.style.borderColor='rgba(255,255,255,.08)'}}

// ===================================================================
//  MODE 1: CLI — 完全的命令行模拟器
// ===================================================================
const cliStyles = `
.cli-root{background:#0d0d0d;min-height:100vh;font-family:'JetBrains Mono',monospace;
  display:flex;flex-direction:column;color:#e0e0e0;padding-top:40px;}
.cli-output{flex:1;overflow-y:auto;padding:12px 16px 4px;scroll-behavior:smooth;}
.cli-line{font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-all;padding:0 4px;}
.cli-line.green{color:#00ff41}
.cli-line.dim{color:#00ff4160}
.cli-line.red{color:#ff5555}
.cli-line.yellow{color:#f1fa8c}
.cli-line.pink{color:#ff79c6}

.cli-line.bold{font-weight:700}
.cli-line-sep{height:1px;background:#00ff4115;margin:6px 0;}

function CliLine({children,cls=''}){
  return <div className={'cli-line'+(cls?' '+cls:'')}>{children}</div>;
}

function CliTable({repos}){
  return (
    <table className="cli-table">
      <thead><tr><th className="rn">#</th><th>REPOSITORY</th><th>DESCRIPTION</th><th>LANG</th><th>STARS</th><th>Δ</th></tr></thead>
      <tbody>
        {repos.map((r,i)=>(
          <tr key={r.fullName||i}>
            <td className="rn">{i+1}</td>
            <td className="nm"><a href={r.url||'#'} target="_blank" style={{color:'#00ff41',textDecoration:'none'}}>{r.fullName}</a></td>
            <td className="ds">{(r.description||'').slice(0,75)}</td>
            <td className="ln">{r.language||'—'}</td>
            <td className="st">{(r.totalStars||r.stars||0).toLocaleString()}</td>
            <td className="td">{r.todayStars?'+'+r.todayStars:''}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function CliTopicsView({data}){
  if(!data||data.length===0)return null;
  return <div>{data.map(g=><div key={g.topic} style={{marginBottom:8}}>
    <CliLine cls="green bold">▸ {g.topic} ({g.repos.length} repos)</CliLine>
    {g.repos.slice(0,5).map(r=>
      <CliLine key={r.fullName} cls="dim">
        {'  '}★{r.stars?.toLocaleString()}  <a href={r.url} target="_blank" style={{color:'#00ff41',textDecoration:'none'}}>{r.fullName}</a>
      </CliLine>
    )}
  </div>)}</div>;
}

function CliReportView({data}){
  if(!data||data.message)return <CliLine cls="dim">{data?.message||'loading...'}</CliLine>;
  return <>
    <CliLine cls="dim">tracked: {data.trackedDays} days · unique repos: {data.uniqueRepos}</CliLine>
    <div className="cli-line-sep"/>
    <CliLine cls="green bold">TOP SUSTAINED REPOS</CliLine>
    {data.topTrending?.slice(0,15).map((r,i)=>
      <CliLine key={r.fullName}>
        {'  '}{(i+1+'').padStart(2)}. <a href={r.url} target="_blank" style={{color:'#00ff41',textDecoration:'none'}}>{r.fullName}</a>
        {'  '}{r.appearances}d  ★{r.totalStarsLatest?.toLocaleString()}  {r.language||'—'}
      </CliLine>
    )}
  </>;
}

function CliMode({t, lang}){
  const [lines,setLines]=useState([]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(null);
  const [history,setHistory]=useState([]);
  const [histIdx,setHistIdx]=useState(-1);
  const inputRef=useRef(null);
  const outRef=useRef(null);

  const addLine=(text,cls='')=>setLines(p=>[...p,{text,cls}]);
  const addLines=(arr)=>setLines(p=>[...p,...arr]);

  useEffect(()=>{if(outRef.current)outRef.current.scrollTop=outRef.current.scrollHeight},[lines,loading]);

  useEffect(()=>{
    setLines([
      {text:'╔══════════════════════════════════════════════╗',cls:'green'},
      {text:'║     GITHUB TREND TRACKER  v2.0              ║',cls:'green'},
      {text:'║     ' + t('cli.welcome').padEnd(42) + '║',cls:'green'},
      {text:'╚══════════════════════════════════════════════╝',cls:'green'},
      {text:'',cls:''},
    ]);
  },[lang]);

  const execute=useCallback(async(cmdStr)=>{
    const trimmed=cmdStr.trim();
    if(!trimmed)return;
    addLine(`❯ ${trimmed}`,'green bold');
    setHistory(h=>[...h,trimmed]);
    setHistIdx(-1);

    const parts=trimmed.split(/\s+/);
    const cmd=parts[0].toLowerCase();
    const args=parts.slice(1);

    if(cmd==='help'){
      addLines([
        {text:'',cls:''},
        {text:'  ' + t('cli.cmds.commands'), cls:'green bold'},
        {text:'',cls:''},
        {text:'  trending [daily|weekly|monthly]   ' + t('cli.cmds.trending'), cls:'dim'},
        {text:'  topic <name> [--min N]            ' + t('cli.cmds.topic'), cls:'dim'},
        {text:'  batch                             ' + t('cli.cmds.batch'), cls:'dim'},
        {text:'  report                            ' + t('cli.cmds.report'), cls:'dim'},
        {text:'  lang <language>                   ' + t('cli.cmds.lang'), cls:'dim'},
        {text:'  clear                             ' + t('cli.cmds.clear'), cls:'dim'},
        {text:'  help                              ' + t('cli.cmds.help'), cls:'dim'},
        {text:'',cls:''},
        {text:'  ' + t('cli.tip'), cls:'gray'},
        {text:'',cls:''},
      ]);
      return;
    }

    if(cmd==='clear'){
      setLines([]);
      return;
    }

    if(cmd==='trending'){
      const since=args[0]||'daily';
      if(!['daily','weekly','monthly'].includes(since)){
        addLine(`  ${t('usage')}: daily/weekly/monthly`,'red');
        return;
      }
      setLoading('trending');
      addLine(`  ${t('cli.fetching')} (${since})...`,'dim');
      try{
        const r=await fetch(`${API}/trending?since=${since}`);
        if(!r.ok)throw new Error(r.statusText);
        const data=await r.json();
        setLoading(null);
        addLine(`  ${t('cli.found')} ${data.length} ${t('cli.repos')}`,'dim');
        addLine('','');
        setLines(p=>[...p,{text:'',cls:''},{text:'',react:<CliTable key='t' repos={data}/>}]);
      }catch(e){
        setLoading(null);
        addLine(`  ${t('error')}: ${e.message}`,'red');
      }
      return;
    }

    if(cmd==='topic'){
      const topicIdx=args.indexOf('--min');
      const topic=topicIdx>0?args.slice(0,topicIdx).join(' '):args[0];
      const minStars=topicIdx>=0?parseInt(args[topicIdx+1])||500:200;
      if(!topic){
        addLine(`  ${t('usage')}: topic <name> [--min N]`,'yellow');
        return;
      }
      setLoading('topic');
      addLine(`  searching "${topic}" (min ★${minStars})...`,'dim');
      try{
        const r=await fetch(`${API}/topics/search?topic=${topic}&min=${minStars}`);
        if(!r.ok)throw new Error(r.statusText);
        const data=await r.json();
        setLoading(null);
        if(Array.isArray(data)&&data.length){
          addLine(`  ${t('cli.found')} ${data.length} ${t('cli.repos')}`,'dim');
          addLine('','');
          setLines(p=>[...p,{text:'',cls:''},{text:'',react:<CliTable key='top' repos={data}/>}]);
        } else addLine(`  ${t('noResults')}`,'yellow');
      }catch(e){
        setLoading(null);
        addLine(`  ${t('error')}: ${e.message}`,'red');
      }
      return;
    }

    if(cmd==='batch'){
      setLoading('batch');
      addLine(`  ${t('cli.scanned')}...` ,'dim');
      try{
        const r=await fetch(`${API}/topics/batch`);
        if(!r.ok)throw new Error(r.statusText);
        const d=await r.json();
        setLoading(null);
        const entries=Object.entries(d).filter(([,v])=>v.length).map(([k,v])=>({topic:k,repos:v}));
        addLine(`  ${t('cli.scanned')} ${entries.length} topics, ${entries.reduce((s,e)=>s+e.repos.length,0)} repos`,'dim');
        addLine('','');
        setLines(p=>[...p,{text:'',cls:''},{text:'',react:<CliTopicsView key='bt' data={entries}/>}]);
      }catch(e){
        setLoading(null);
        addLine(`  ${t('error')}: ${e.message}`,'red');
      }
      return;
    }

    if(cmd==='report'){
      setLoading('report');
      addLine(`  ${t('cli.generating')}...`,'dim');
      try{
        const r=await fetch(`${API}/report`);
        if(!r.ok)throw new Error(r.statusText);
        const data=await r.json();
        setLoading(null);
        addLine('','');
        setLines(p=>[...p,{text:'',cls:''},{text:'',react:<CliReportView key='rp' data={data}/>}]);
      }catch(e){
        setLoading(null);
        addLine(`  error: ${e.message}`,'red');
      }
      return;
    }

    if(cmd==='lang'){
      const langName=args[0];
      if(!langName){
        addLine('  '+t('usage')+': lang <language>','yellow');
        return;
      }
      setLoading('lang');
      addLine(`  ${t('cli.fetching')} "${langName}"...`,'dim');
      try{
        const r=await fetch(`${API}/trending?since=daily&language=${langName}`);
        if(!r.ok)throw new Error(r.statusText);
        const data=await r.json();
        setLoading(null);
        if(data.length){
          addLine(`  ${t('cli.found')} ${data.length} ${langName} repos`,'dim');
          addLine('','');
          setLines(p=>[...p,{text:'',cls:''},{text:'',react:<CliTable key='lg' repos={data}/>}]);
        } else addLine('  '+t('noResults')+' for '+langName,'yellow');
      }catch(e){
        setLoading(null);
        addLine(`  ${t('error')}: ${e.message}`,'red');
      }
      return;
    }

    addLine(`  ${t('unknown')}: ${cmd}`, 'red');
  },[t, lang]);

  const onKeyDown=(e)=>{
    if(e.key==='Enter'){
      execute(input);
      setInput('');
    } else if(e.key==='ArrowUp'){
      e.preventDefault();
      if(history.length===0)return;
      const newIdx=histIdx===-1?history.length-1:Math.max(0,histIdx-1);
      setHistIdx(newIdx);
      setInput(history[newIdx]);
    } else if(e.key==='ArrowDown'){
      e.preventDefault();
      if(histIdx===-1){setInput('');return}
      const newIdx=histIdx+1;
      if(newIdx>=history.length){setHistIdx(-1);setInput('');return}
      setHistIdx(newIdx);
      setInput(history[newIdx]);
    }
  };

  return <div className="cli-root" onClick={()=>inputRef.current?.focus()}>
    <div className="cli-output" ref={outRef}>
      {lines.map((l,i)=>{
        if(l.react)return <div key={i}>{l.react}</div>;
        return <CliLine key={i} cls={l.cls}>{l.text}</CliLine>;
      })}
      {loading&&<div className="cli-loading"><span style={{animation:'blinkCl 1s step-end infinite'}}>▌</span> {loading}...</div>}
    </div>
    <div className="cli-input-line">
      <span className="cli-prompt-path">~/tracker</span>
      <span className="cli-prompt">❯ </span>
      <input ref={inputRef} className="cli-input" value={input}
        onChange={e=>setInput(e.target.value)} onKeyDown={onKeyDown}
        placeholder="type command..." spellCheck={false} autoFocus
      />
    </div>
  </div>;
}

.tui-badge{border:1px solid #ff79c640;padding:1px 6px;font-size:9px;color:#ff79c680;border-radius:2px;}
.tui-nav{display:flex;gap:1px;}
.tui-nav-btn{background:transparent;border:1px solid transparent;color:#6272a4;padding:4px 12px;font-family:inherit;font-size:10px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;transition:all .15s;}
.tui-nav-btn.active{color:#ff79c6;border-color:#ff79c640;background:#ff79c610;}
.tui-nav-btn:hover{color:#f8f8f2;}
.tui-body{flex:1;padding:14px 20px;overflow-y:auto;}
.tui-body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,rgba(255,121,198,.008) 0,rgba(255,121,198,.008) 1px,transparent 1px,transparent 3px);pointer-events:none;z-index:999;}
.tui-stats{display:flex;gap:20px;margin-bottom:12px;font-size:11px;color:#6272a4;}
.tui-stat span{color:#ff79c6;font-weight:600;}
.tui-controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.tui-select{background:#000;color:#f8f8f2;border:1px solid #ff79c630;padding:4px 8px;font-family:inherit;font-size:10px;cursor:pointer;}
.tui-select option{background:#000;color:#f8f8f2;}
.tui-btn{background:#ff79c610;color:#ff79c6;border:1px solid #ff79c640;padding:4px 10px;font-family:inherit;font-size:10px;cursor:pointer;transition:all .15s;}
.tui-btn:hover{background:#ff79c620;}
.tui-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px;}
.tui-card{border:1px solid #ff79c615;padding:10px 12px;transition:all .2s;cursor:default;}
.tui-card:hover{border-color:#ff79c640;background:#ff79c608;}
.tui-card-name{font-weight:600;font-size:12px;margin-bottom:3px;}
.tui-card-name a{color:#ff79c6;text-decoration:none;}
.tui-card-name a:hover{text-decoration:underline;}
.tui-card-desc{font-size:10px;color:#6272a4;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tui-card-meta{display:flex;gap:12px;font-size:9px;color:#44475a;flex-wrap:wrap;}
.tui-card-meta .hl{color:#f1fa8c;font-weight:600;}
.tui-loading{text-align:center;padding:60px;color:#6272a4;font-size:11px;}
.tui-spinner{display:inline-block;width:16px;height:16px;border:2px solid #ff79c610;border-top-color:#ff79c6;border-radius:50%;animation:tuiSpin .6s linear infinite;margin-bottom:6px;}
@keyframes tuiSpin{to{transform:rotate(360deg)}}
.tui-footer{border-top:1px solid #ff79c615;padding:6px 20px;font-size:9px;color:#44475a;display:flex;gap:16px;}
.tui-topics-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px;}
.tui-tg{border:1px solid #ff79c615;padding:8px 10px;}
.tui-tg h3{font-size:10px;color:#ff79c6;font-weight:400;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
.tui-tg-item{font-size:9px;color:#6272a4;padding:2px 0;display:flex;justify-content:space-between;}
.tui-tg-item a{color:#f8f8f2;text-decoration:none;}
.tui-tg-item a:hover{color:#ff79c6;}
.tui-rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;}
.tui-rc{border:1px solid #ff79c615;padding:8px 10px;}
.tui-rc .nm{font-size:11px;}
.tui-rc .nm a{color:#ff79c6;text-decoration:none;}
.tui-rc .mt{font-size:9px;color:#6272a4;margin-top:3px;}

function TuiCard({r}){
  return <div className="tui-card">
    <div className="tui-card-name"><a href={r.url||'#'} target="_blank">{r.fullName||'?'}</a></div>
    <div className="tui-card-desc">{(r.description||'').slice(0,100)}</div>
    <div className="tui-card-meta">
      {r.language&&<span>{r.language}</span>}
      <span>★ {(r.totalStars||r.stars||0).toLocaleString()}</span>
      {r.todayStars?<span className="hl">+{r.todayStars}</span>:null}
      <span>⑂ {r.forks||0}</span>
    </div>
  </div>;
}

function TuiTopicsView({t}){
  const [data,setData]=useState(null);const [q,setQ]=useState('');const [l,setL]=useState(false);const [e,setE]=useState('');
  const search=async()=>{if(!q)return;setL(true);setE('');try{const r=await fetch(`${API}/topics/search?topic=${q}&min=200`);if(!r.ok)throw new Error();setData(await r.json())}catch(x){setE(x.message)}finally{setL(false)}};
  const batch=async()=>{setL(true);setE('');setQ('(batch)');try{const r=await fetch(`${API}/topics/batch`);if(!r.ok)throw new Error();const d=await r.json();setData(Object.entries(d).filter(([,v])=>v.length).map(([k,v])=>({topic:k,repos:v})))}catch(x){setE(x.message)}finally{setL(false)}};
  return <><div className="tui-controls">
    <input value={q} onChange={e=>setQ(e.target.value)} placeholder="topic..." onKeyDown={e=>e.key==='Enter'&&search()}
      style={{background:'#000',border:'1px solid #ff79c630',color:'#f8f8f2',padding:'4px 8px',fontFamily:'inherit',fontSize:'10px',outline:'none',width:140}} />
    <button className="tui-btn" onClick={search}>{t('query')}</button>
    <button className="tui-btn" onClick={batch}>{t('batch')}</button>
  </div>
  {l?<div className="tui-loading"><div className="tui-spinner"></div>{t('scanning')}</div>
  :e?<div style={{color:'#ff5555',fontSize:11}}>{e}</div>
  :Array.isArray(data)&&data[0]?.topic?
    <div className="tui-topics-g">{data.map(g=><div key={g.topic} className="tui-tg">
      <h3>▸ {g.topic} ({g.repos.length})</h3>
      {g.repos.slice(0,5).map(r=><div key={r.fullName} className="tui-tg-item">
        <a href={r.url} target="_blank">{r.fullName}</a><span>★{r.stars?.toLocaleString()}</span>
      </div>)}
    </div>)}</div>
  :Array.isArray(data)?<div className="tui-grid">{data.map((r,i)=><TuiCard key={r.fullName||i} r={r}/>)}</div>
  :null}</>;
}

function TuiReportView({t}){
  const [r,setR]=useState(null);
  useEffect(()=>{fetch(`${API}/report`).then(r=>r.json()).then(setR).catch(()=>{})},[]);
  if(!r||r.message)return <div className="tui-loading"><div className="tui-spinner"></div>{r?.message||t('loading')}</div>;
  return <><div className="tui-stats"><span>{t('daysTracked')} <span>{r.trackedDays}{t('days')}</span></span><span>{t('uniqueRepos')} <span>{r.uniqueRepos}</span></span></div>
  <div className="tui-rg">{r.topTrending?.slice(0,12).map(r=><div key={r.fullName} className="tui-rc">
    <div className="nm"><a href={r.url} target="_blank">{r.fullName}</a></div>
    <div className="mt">{r.appearances}{t('days')} · ★{r.totalStarsLatest?.toLocaleString()} · {r.language||'—'}</div>
  </div>)}</div></>;
}

function TuiMode({t, lang}){
  const [view,setView]=useState('trending');
  const [since,setSince]=useState('daily');
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');

  const fetchTrending=useCallback(async(s)=>{
    setLoading(true);setErr('');
    try{const r=await fetch(`${API}/trending?since=${s}`);if(!r.ok)throw new Error();setData(await r.json())}
    catch(x){setErr(x.message)}finally{setLoading(false)}
  },[]);

  useEffect(()=>{if(view==='trending')fetchTrending(since)},[view,since,fetchTrending]);

  return <div className="tui-root">
    <div className="tui-header">
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <span className="tui-logo">GITHUB::TRACKER</span>
        <span className="tui-badge">{t('badge')}</span>
      </div>
      <div className="tui-nav">
        {['trending','topics','report'].map(v=>(
          <button key={v} className={'tui-nav-btn'+(view===v?' active':'')} onClick={()=>setView(v)}>{t(v)}</button>
        ))}
      </div>
    </div>
    <div className="tui-body">
      {view==='trending'&&<>
        <div className="tui-stats">
          <span>{t('repos')} <span>{data?.length||0}</span></span>
          <span>{t('languages')} <span>{new Set(data?.map(r=>r.language).filter(Boolean)).size||0}</span></span>
        </div>
        <div className="tui-controls">
          <select className="tui-select" value={since} onChange={e=>{setSince(e.target.value)}}>
            <option value="daily">{t('daily')}</option><option value="weekly">{t('weekly')}</option><option value="monthly">{t('monthly')}</option>
          </select>
          <button className="tui-btn" onClick={()=>fetchTrending(since)}>↻ {t('sync')}</button>
        </div>
        {loading?<div className="tui-loading"><div className="tui-spinner"></div>{t('loading')}</div>
        :err?<div style={{color:'#ff5555',fontSize:11}}>{t('error')}: {err}</div>
        :data?.length?<div className="tui-grid">{data.map((r,i)=><TuiCard key={r.fullName||i} r={r}/>)}</div>
        :<div className="tui-loading">{t('noData')}</div>}
      </>}
      {view==='topics'&&<TuiTopicsView t={t} lang={lang}/>}
      {view==='report'&&<TuiReportView t={t} lang={lang}/>}
    </div>
    <div className="tui-footer">
      <span>[SYS] {t('uptime')}: ∞</span>
      <span>[{t('mem')}] {Math.round(performance.memory?.usedJSHeapSize/1048576||42)}MB</span>
      <span>[{t('pid')}] 0x{Math.random().toString(16).slice(2,6)}</span>
    </div>
  </div>;
}

    catch(x){setErr(x.message)}finally{setLoading(false)}
  },[]);

  useEffect(()=>{if(view==='trending')fetchTrending(since)},[view,since,fetchTrending]);

  const isNativeElectron = typeof IS_ELECTRON !== 'undefined' && IS_ELECTRON;

  return <div className="el-root">
    {/* Simulated macOS titlebar — hidden in real Electron */}
    {!isNativeElectron && <div className="el-titlebar">
      <div className="el-dots"><span className="el-dot r"/><span className="el-dot y"/><span className="el-dot g"/></div>
      <div className="el-title-text">{t('el.title')} — {view}</div>
    </div>}

    <div className="el-header" style={isNativeElectron?{WebkitAppRegion:'drag',paddingTop:40}:{}}>
      <div style={{display:'flex',alignItems:'center',WebkitAppRegion:'no-drag'}}>
        <span className="el-logo">◆ {t('el.logo')}</span>
        <span className="el-logo-sub">{t('el.subtitle')}</span>
      </div>
      <div className="el-nav">
        {['trending','topics','report'].map(v=>(
          <button key={v} className={'el-nav-btn'+(view===v?' active':'')} onClick={()=>setView(v)}>{t(v)}</button>
        ))}
      </div>
    </div>

    <div className="el-main">
      {view==='trending'&&<>
        <div className="el-controls">
          <select value={since} onChange={e=>setSince(e.target.value)}>
            <option value="daily">{t('daily')}</option><option value="weekly">{t('weekly')}</option><option value="monthly">{t('monthly')}</option>
          </select>
          <button onClick={()=>fetchTrending(since)}>⟳ {t('refresh')}</button>
        </div>
        {loading?<div className="el-loading"><div className="el-spinner"></div>{t('el.loading')}</div>
        :err?<div className="el-error">⚠ {err}</div>
        :<>
          <div className="el-stats">
            <div className="el-stat"><div className="el-stat-num">{data?.length||0}</div><div className="el-stat-label">{t('repos')}</div></div>
            <div className="el-stat"><div className="el-stat-num">{new Set(data?.map(r=>r.language).filter(Boolean)).size||0}</div><div className="el-stat-label">{t('languages')}</div></div>
            <div className="el-stat"><div className="el-stat-num">{data?.reduce((s,r)=>s+(r.todayStars||0),0)||0}</div><div className="el-stat-label">{t('starsToday')}</div></div>
            <div className="el-stat"><div className="el-stat-num">{data?.reduce((s,r)=>s+(r.forks||0),0)||0}</div><div className="el-stat-label">{t('forks')}</div></div>
          </div>
          <div className="el-section-title">{t('trending')} <span>{data?.length||0}</span></div>
          {data?.length?<div className="el-grid">{data.map((r,i)=><ElCard key={r.fullName||i} r={r}/>)}</div>:null}
        </>}
      </>}
      {view==='topics'&&<ElTopicsView t={t}/>}
      {view==='report'&&<ElReportView t={t}/>}
    </div>
  </div>;
}

// ===================================================================
//  APP
// ===================================================================
const appStyles = `
.mode-enter{animation:fadeSlide .3s ease-out}
@keyframes fadeSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
`;

function App(){
  const [mode,setMode]=useState(()=>localStorage.getItem('gt-mode')||'tui');
  const [animKey,setAnimKey]=useState(0);
  const {t,lang,setLang}=useI18n();

  const switchMode=(m)=>{setMode(m);setAnimKey(k=>k+1);localStorage.setItem('gt-mode',m)};

  useEffect(()=>{
    const s=document.getElementById('mode-styles');
    if(s)s.remove();
    const st=document.createElement('style');st.id='mode-styles';
    if(mode==='cli')st.textContent=cliStyles;
    else if(mode==='tui')st.textContent=tuiStyles;
    else st.textContent=elStyles;
    document.head.appendChild(st);
    return ()=>{const ss=document.getElementById('mode-styles');if(ss)ss.remove()};
  },[mode]);

  return <>
    <ModeSwitcher mode={mode} onMode={switchMode} onRefresh={()=>{}} lang={lang} setLang={setLang}/>
    <div key={animKey} className="mode-enter">
      {mode==='cli'&&<CliMode t={t} lang={lang}/>}
      {mode==='tui'&&<TuiMode t={t} lang={lang}/>}
      {mode==='el'&&<ElMode t={t} lang={lang}/>}
    </div>
  </>;
}

const as=document.createElement('style');as.id='app-styles-base';as.textContent=appStyles;
document.head.appendChild(as);
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
